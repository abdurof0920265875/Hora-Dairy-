<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f54">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>COBFCU Dairy Farm</title>
<style>:root{
  --bg:#f4f7f5;--card:#fff;--ink:#17231e;--mute:#5d6b64;--line:#dfe6e2;
  --brand:#1f6f54;--brand-ink:#fff;--brand-soft:#e3f1ea;
  --good:#1b7a3d;--warn:#a86400;--bad:#b3261e;--info:#1c5d99;
  --good-bg:#e4f4ea;--warn-bg:#fff1d9;--bad-bg:#fde8e6;--info-bg:#e5f0fb;
  --nav:62px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1512;--card:#18211d;--ink:#e8f0ec;--mute:#9aaaa2;--line:#2a3730;--brand:#58b996;--brand-ink:#06251a;--brand-soft:#1d3a2f;
    --good:#6fd08e;--warn:#f0b455;--bad:#ff8a80;--info:#7ab8f0;--good-bg:#16301f;--warn-bg:#35280f;--bad-bg:#3a1a17;--info-bg:#14283b}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top h1{margin:0;font-size:18px;font-weight:650;line-height:1.2}
.top small{display:block;opacity:.85;font-size:13px}
main{padding:12px 12px 8px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:15px;font-weight:650}
.muted{color:var(--mute)}.small{font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--brand-soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px;line-height:1.15}
.stat span{font-size:12px;color:var(--mute)}
.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--brand);color:var(--brand-ink);font-weight:600;min-height:44px;cursor:pointer}
.btn.sec{background:var(--brand-soft);color:var(--ink)}
.btn.del{background:var(--bad-bg);color:var(--bad)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.quick .btn{padding:10px 4px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;min-height:38px;cursor:pointer}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.seg{display:flex;background:var(--brand-soft);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font-weight:600;color:var(--mute);min-height:40px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.rec{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.rec .t{font-weight:600}.rec .s{font-size:13px;color:var(--mute)}.rec .r{text-align:right;font-weight:650;white-space:nowrap}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;margin-left:4px;background:var(--info-bg);color:var(--info)}
.tag.good{background:var(--good-bg);color:var(--good)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.alert{padding:10px 12px;border-radius:10px;margin-bottom:6px;font-size:14px;background:var(--info-bg);color:var(--info);cursor:pointer}
.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.bad{background:var(--bad-bg);color:var(--bad)}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:30px;box-shadow:0 4px 14px #0004;z-index:6}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mute)}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand);font-weight:700}
/* forms */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:#0007;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:2px 0 12px;font-size:17px}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
label.f input,label.f select,label.f textarea,.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px;min-height:44px}
label.f textarea{min-height:76px}
label.f em{font-style:normal;font-size:12px;color:var(--mute);display:block;margin-top:3px}
.calc{background:var(--brand-soft);border-radius:10px;padding:11px 12px;font-weight:650}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
/* report table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;text-align:right;font-weight:600;color:var(--mute);padding:6px 4px;border-bottom:1px solid var(--line);font-size:12px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.tbl td:first-child{width:38%}
.tbl tr.area td{background:var(--brand-soft);font-weight:650;text-align:left;font-size:12px;padding:5px 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.tbl tr.ind{cursor:pointer}
.tbl .u{display:block;color:var(--mute);font-size:11px}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.autodot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);margin-right:3px;vertical-align:middle}
details{border-top:1px solid var(--line);padding:8px 0}
details summary{font-weight:600;cursor:pointer;min-height:36px;display:flex;align-items:center}
.bars{display:flex;align-items:flex-end;gap:3px;height:84px;margin-top:6px}
.bars i{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
.bars-l{display:flex;gap:3px;font-size:10px;color:var(--mute)}.bars-l span{flex:1;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 76px);background:#222;color:#fff;padding:10px 16px;border-radius:999px;z-index:30;font-size:14px;max-width:90%}
.toast[hidden]{display:none}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.list-item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--bg)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>/* COBFCU Dairy Farm Reporting - core logic (no DOM). Works in browser and Node. */
(function (root) {
'use strict';

/* ---------- Ethiopian calendar ---------- */
const EC_MONTHS = ['Meskerem','Tikimt','Hidar','Tahsas','Tir','Yekatit','Megabit','Miazia','Ginbot','Sene','Hamle','Nehase','Pagume'];
const EPOCH = 1723856;

function gregToJDN(y, m, d) {
  const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
  return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
}
function jdnToGreg(j) {
  const a = j + 32044, b = Math.floor((4 * a + 3) / 146097), c = a - Math.floor(146097 * b / 4);
  const d = Math.floor((4 * c + 3) / 1461), e = c - Math.floor(1461 * d / 4), m = Math.floor((5 * e + 2) / 153);
  return { d: e - Math.floor((153 * m + 2) / 5) + 1, m: m + 3 - 12 * Math.floor(m / 10), y: 100 * b + d - 4800 + Math.floor(m / 10) };
}
function ecToJDN(y, m, d) { return EPOCH + 365 + 365 * (y - 1) + Math.floor(y / 4) + 30 * m + d - 31; }
function jdnToEC(j) {
  const t = j - EPOCH, r = ((t % 1461) + 1461) % 1461;
  const n = (r % 365) + 365 * Math.floor(r / 1460);
  return { y: 4 * Math.floor(t / 1461) + Math.floor(r / 365) - Math.floor(r / 1460), m: Math.floor(n / 30) + 1, d: (n % 30) + 1 };
}
const pad = (n, w) => String(n).padStart(w || 2, '0');
function isoToJDN(iso) { const p = iso.split('-').map(Number); return gregToJDN(p[0], p[1], p[2]); }
function jdnToISO(j) { const g = jdnToGreg(j); return g.y + '-' + pad(g.m) + '-' + pad(g.d); }
function isoToEC(iso) { return jdnToEC(isoToJDN(iso)); }
function ecToISO(y, m, d) { return jdnToISO(ecToJDN(y, m, d)); }
function ecIsLeap(y) { return y % 4 === 3; }
function ecMonthDays(y, m) { return m === 13 ? (ecIsLeap(y) ? 6 : 5) : 30; }
function addDays(iso, n) { return jdnToISO(isoToJDN(iso) + n); }
function daysBetween(a, b) { return isoToJDN(b) - isoToJDN(a); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fmtEC(iso, short) {
  if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return '';
  const e = isoToEC(iso);
  return EC_MONTHS[e.m - 1] + ' ' + e.d + (short ? '' : ', ' + e.y + ' E.C.');
}
function fmtGC(iso) {
  if (!iso) return '';
  const p = iso.split('-').map(Number);
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][p[1] - 1] + ' ' + p[2] + ', ' + p[0];
}

/* ---------- Periods ---------- */
function yearMonths(y, startMonth) {
  const out = [];
  if (!startMonth || startMonth === 1) { for (let m = 1; m <= 13; m++) out.push({ y, m }); return out; }
  for (let m = startMonth; m <= 13; m++) out.push({ y: y - 1, m });
  for (let m = 1; m < startMonth; m++) out.push({ y, m });
  return out;
}
// p: {type:'month',y,m} | {type:'quarter',y,q} | {type:'year',y}
function resolvePeriod(p, settings) {
  const sm = (settings && settings.yearStart) || 1;
  let months, label, key;
  if (p.type === 'month') { months = [{ y: p.y, m: p.m }]; label = EC_MONTHS[p.m - 1] + ' ' + p.y + ' E.C.'; key = 'm:' + p.y + ':' + p.m; }
  else if (p.type === 'quarter') {
    const all = yearMonths(p.y, sm), b = [[0, 3], [3, 6], [6, 9], [9, 13]][p.q - 1];
    months = all.slice(b[0], b[1]); key = 'q:' + p.y + ':' + p.q;
    label = 'Q' + p.q + ' ' + p.y + ' E.C. (' + EC_MONTHS[months[0].m - 1] + ' – ' + EC_MONTHS[months[months.length - 1].m - 1] + ')';
  } else { months = yearMonths(p.y, sm); key = 'y:' + p.y; label = (sm === 1 ? '' : 'Fiscal year ') + p.y + ' E.C.'; }
  const f = months[0], l = months[months.length - 1];
  const start = ecToISO(f.y, f.m, 1), end = ecToISO(l.y, l.m, ecMonthDays(l.y, l.m));
  const gcStart = fmtGC(start), gcEnd = fmtGC(end);
  return { type: p.type, key, months, start, end, label, days: daysBetween(start, end) + 1, gcLabel: gcStart + ' – ' + gcEnd };
}
const monthKey = (m) => 'm:' + m.y + ':' + m.m;
function currentMonth(today) { const e = isoToEC(today || todayISO()); return { y: e.y, m: e.m }; }
function currentQuarter(today, settings) {
  const cm = currentMonth(today), sm = (settings && settings.yearStart) || 1;
  // year label of the period that contains today
  const yrs = [cm.y, cm.y + 1];
  for (const y of yrs) {
    const all = yearMonths(y, sm);
    const idx = all.findIndex(x => x.y === cm.y && x.m === cm.m);
    if (idx >= 0) return { y, q: idx < 3 ? 1 : idx < 6 ? 2 : idx < 9 ? 3 : 4 };
  }
  return { y: cm.y, q: 1 };
}
function currentYearLabel(today, settings) { return currentQuarter(today, settings).y; }

/* ---------- Schema ---------- */
const HERD_CATS = ['Lactating cow', 'Dry cow', 'Heifer', 'Calf', 'Bull', 'Other'];
const COLLECTIONS = {
  milk: {
    title: 'Milk', sheet: 'Daily Milk Log', head: 'DAILY MILK PRODUCTION AND SALES LOG', sub: 'Record morning/evening milk, use, sales, and losses', dateField: 'date',
    fields: [
      { k: 'date', label: 'Date', type: 'date', required: true },
      { k: 'session', label: 'Milking session', type: 'select', options: ['Morning', 'Evening', 'Whole day'], def: 'Morning' },
      { k: 'produced', label: 'Milk produced (L)', type: 'number', required: true },
      { k: 'onFarm', label: 'Milk used on farm (L)', type: 'number' },
      { k: 'sold', label: 'Milk sold (L)', type: 'number' },
      { k: 'rejected', label: 'Rejected / spoiled (L)', type: 'number' },
      { k: 'buyer', label: 'Buyer / destination', type: 'text' },
      { k: 'price', label: 'Price (ETB/L)', type: 'number' },
      { k: 'revenue', label: 'Revenue (ETB)', type: 'calc', calc: r => num(r.sold) * num(r.price), dec: 2 },
      { k: 'quality', label: 'Quality test result', type: 'select', options: ['Not tested', 'Pass', 'Fail'], def: 'Not tested' },
      { k: 'remarks', label: 'Remarks', type: 'text' }
    ],
    xl: [['No.', null], ['Date', r => dateCell(r.date)], ['Milking session', r => r.session], ['Milk produced (L)', r => nz(r.produced)], ['Milk used on farm (L)', r => nz(r.onFarm)], ['Milk sold (L)', r => nz(r.sold)], ['Rejected / spoiled (L)', r => nz(r.rejected)], ['Buyer / destination', r => r.buyer], ['Price (ETB/L)', r => nz(r.price)], ['Revenue (ETB)', r => num(r.sold) * num(r.price)], ['Quality test / remarks', r => [r.quality && r.quality !== 'Not tested' ? r.quality : '', r.remarks].filter(Boolean).join(' – ')]],
    widths: [6, 22, 14, 14, 14, 12, 14, 22, 12, 14, 30]
  },
  herd: {
    title: 'Herd', sheet: 'Herd Register', head: 'HERD INVENTORY AND MOVEMENT REGISTER', sub: 'Update animal status and movements', dateField: null,
    fields: [
      { k: 'animalId', label: 'Animal ID / tag', type: 'text', required: true },
      { k: 'breed', label: 'Breed', type: 'text', list: ['Holstein Friesian', 'Jersey', 'Cross-breed (F1)', 'Cross-breed (F2)', 'Local (Zebu)'] },
      { k: 'sex', label: 'Sex', type: 'select', options: ['Female', 'Male'], def: 'Female' },
      { k: 'category', label: 'Category / status', type: 'select', options: HERD_CATS, def: 'Lactating cow' },
      { k: 'dob', label: 'Date of birth', type: 'date' },
      { k: 'entryType', label: 'How the animal entered the herd', type: 'select', options: ['Opening stock', 'Born on farm', 'Purchased'], def: 'Opening stock' },
      { k: 'entryDate', label: 'Date born / purchased', type: 'date', hint: 'Needed for "Born on farm" and "Purchased" so births are counted in the right month.' },
      { k: 'exitType', label: 'Left the herd?', type: 'select', options: ['No', 'Died', 'Sold', 'Culled'], def: 'No' },
      { k: 'exitDate', label: 'Date of death / sale / cull', type: 'date' },
      { k: 'remarks', label: 'Remarks', type: 'text' }
    ],
    xl: [['No.', null], ['Animal ID', r => r.animalId], ['Breed', r => r.breed], ['Sex', r => r.sex], ['Category / status', r => r.category], ['Date of birth', r => dateCell(r.dob)], ['Opening status', r => r.entryType === 'Opening stock' ? 'In herd (opening)' : ''], ['Births / purchases', r => r.entryType !== 'Opening stock' ? r.entryType + (r.entryDate ? ' ' + dateCell(r.entryDate) : '') : ''], ['Deaths / sales / culls', r => r.exitType && r.exitType !== 'No' ? r.exitType + (r.exitDate ? ' ' + dateCell(r.exitDate) : '') : ''], ['Closing status', r => r.exitType && r.exitType !== 'No' ? 'Left herd (' + r.exitType + ')' : 'In herd'], ['Remarks', r => r.remarks]],
    widths: [6, 14, 18, 10, 16, 22, 18, 30, 30, 18, 28]
  },
  breeding: {
    title: 'Breeding', sheet: 'Breeding AI Log', head: 'BREEDING AND ARTIFICIAL INSEMINATION LOG', sub: 'Record heat detection, service, pregnancy diagnosis, and calving', dateField: 'date',
    fields: [
      { k: 'date', label: 'Date', type: 'date', required: true },
      { k: 'animalId', label: 'Animal ID', type: 'text', required: true },
      { k: 'heat', label: 'Heat observed (Y/N)', type: 'select', options: ['Y', 'N'], def: 'Y' },
      { k: 'service', label: 'Service type', type: 'select', options: ['AI', 'Natural', 'None (heat only)'], def: 'AI' },
      { k: 'sire', label: 'Sire / semen ID', type: 'text' },
      { k: 'tech', label: 'Technician', type: 'text' },
      { k: 'pdDate', label: 'Pregnancy diagnosis date', type: 'date' },
      { k: 'result', label: 'Result', type: 'select', options: ['Pending', 'Pregnant', 'Not pregnant'], def: 'Pending' },
      { k: 'expected', label: 'Expected calving date', type: 'calc', calc: r => (r.date && isServed(r) && r.result !== 'Not pregnant') ? addDays(r.date, 283) : '', isDate: true, hint: 'Service date + 283 days' },
      { k: 'calvingDate', label: 'Actual calving date', type: 'date' },
      { k: 'outcome', label: 'Calving outcome', type: 'select', options: ['', 'Live calf', 'Stillbirth', 'Abortion'], def: '' },
      { k: 'remarks', label: 'Remarks', type: 'text' }
    ],
    xl: [['No.', null], ['Date', r => dateCell(r.date)], ['Animal ID', r => r.animalId], ['Heat observed (Y/N)', r => r.heat], ['Service type (AI/natural)', r => r.service], ['Sire / semen ID', r => r.sire], ['Technician', r => r.tech], ['Pregnancy diagnosis date', r => dateCell(r.pdDate)], ['Result', r => r.result], ['Expected calving date', r => (r.date && isServed(r) && r.result !== 'Not pregnant') ? dateCell(addDays(r.date, 283)) : ''], ['Actual calving / outcome', r => [dateCell(r.calvingDate), r.outcome].filter(Boolean).join(' – ')], ['Remarks', r => r.remarks]],
    widths: [6, 22, 14, 12, 16, 16, 16, 22, 14, 22, 30, 28]
  },
  health: {
    title: 'Health', sheet: 'Health Log', head: 'ANIMAL HEALTH, VACCINATION AND TREATMENT LOG', sub: 'Record veterinary activities and disease incidents', dateField: 'date',
    fields: [
      { k: 'date', label: 'Date', type: 'date', required: true },
      { k: 'kind', label: 'Activity type', type: 'select', options: ['Treatment', 'Vaccination', 'Deworming', 'Other'], def: 'Treatment' },
      { k: 'animal', label: 'Animal ID / group', type: 'text', required: true },
      { k: 'head', label: 'Number of animals', type: 'number', def: 1, hint: 'Head covered by this record (e.g. 40 for a herd vaccination).' },
      { k: 'condition', label: 'Condition / disease', type: 'text' },
      { k: 'action', label: 'Action / treatment', type: 'text' },
      { k: 'medicine', label: 'Medicine / vaccine', type: 'text' },
      { k: 'dose', label: 'Dose', type: 'text' },
      { k: 'vet', label: 'Veterinarian / provider', type: 'text' },
      { k: 'outcome', label: 'Outcome / follow-up', type: 'text' },
      { k: 'cost', label: 'Cost (ETB)', type: 'number' },
      { k: 'remarks', label: 'Remarks', type: 'text' }
    ],
    xl: [['No.', null], ['Date', r => dateCell(r.date)], ['Animal ID / group', r => r.animal + (num(r.head) > 1 ? ' (' + num(r.head) + ' head)' : '')], ['Condition / disease', r => r.condition], ['Action / treatment', r => [r.kind, r.action].filter(Boolean).join(': ')], ['Medicine / vaccine', r => r.medicine], ['Dose', r => r.dose], ['Veterinarian / provider', r => r.vet], ['Outcome / follow-up', r => r.outcome], ['Cost (ETB)', r => nz(r.cost)], ['Remarks', r => r.remarks]],
    widths: [6, 22, 22, 22, 26, 20, 12, 22, 24, 12, 28]
  },
  feed: {
    title: 'Feed', sheet: 'Feed Log', head: 'FEED AND FORAGE MANAGEMENT LOG', sub: 'Track feed received, issued, consumed, and forage', dateField: 'date',
    fields: [
      { k: 'date', label: 'Date', type: 'date', required: true },
      { k: 'type', label: 'Feed / forage type', type: 'text', required: true, list: ['Concentrate', 'Wheat bran', 'Noug cake', 'Hay', 'Silage', 'Napier grass', 'Green fodder', 'Mineral / salt'] },
      { k: 'kind', label: 'Feed group', type: 'select', options: ['Concentrate', 'Forage', 'Mineral / other'], def: 'Concentrate' },

/* ---------- Herd presence ---------- */
function presentAt(a, asOf) {
  const entry = a.entryDate || '0000-00-00';
  if (entry > asOf) return false;
  if (a.exitType && a.exitType !== 'No' && a.exitDate && a.exitDate <= asOf) return false;
  return true;
}

/* ---------- Calculations ---------- */
function inP(iso, P) { return !!iso && iso >= P.start && iso <= P.end; }
function sum(list, f) { let s = 0; for (const r of list) s += num(f(r)); return s; }

function computeAuto(db, P, settings, today) {
  today = today || todayISO();
  const asOf = P.end < today ? P.end : today;
  const effEnd = asOf;
  const elapsedDays = Math.max(1, daysBetween(P.start, effEnd) + 1);
  const milk = db.milk.filter(r => inP(r.date, P));
  const sales = db.sales.filter(r => inP(r.date, P));
  const feed = db.feed.filter(r => inP(r.date, P));
  const health = db.health.filter(r => inP(r.date, P));
  const breeding = db.breeding;
  const a = {};
  const started = P.start <= today;
  if (!started) return a;

  if (milk.length) {
    a.milkTotal = sum(milk, r => r.produced);
    a.milkPerDay = a.milkTotal / elapsedDays;
    a.rejected = sum(milk, r => r.rejected);
    const tested = milk.filter(r => r.quality === 'Pass' || r.quality === 'Fail');
    if (tested.length) a.qualityPass = 100 * tested.filter(r => r.quality === 'Pass').length / tested.length;
  }
  // herd (as of end of period or today)
  const present = db.herd.filter(x => presentAt(x, asOf));
  if (db.herd.length) {
    const cnt = c => present.filter(x => x.category === c).length;
    a.herdTotal = present.length; a.lactating = cnt('Lactating cow'); a.dry = cnt('Dry cow'); a.heifers = cnt('Heifer'); a.calves = cnt('Calf');
    a.births = db.herd.filter(x => x.entryType === 'Born on farm' && inP(x.entryDate, P)).length;
    a.deaths = db.herd.filter(x => x.exitType === 'Died' && inP(x.exitDate, P)).length;
    if (a.milkPerDay !== undefined && a.lactating > 0) a.milkPerCow = a.milkPerDay / a.lactating;
  }
  // milk sales
  if ((settings.milkSource || 'milklog') === 'saleslog') {
    const ms = sales.filter(r => /milk/i.test(r.product || ''));
    if (ms.length) { a.milkSold = sum(ms, r => r.qty); a.milkRevenue = sum(ms, r => num(r.qty) * num(r.price)); }
  } else if (milk.length) {
    a.milkSold = sum(milk, r => r.sold); a.milkRevenue = sum(milk, r => num(r.sold) * num(r.price));
  }
  if (a.milkSold > 0 && a.milkRevenue !== undefined) a.avgPrice = a.milkRevenue / a.milkSold;
  // breeding
  const svc = breeding.filter(r => isServed(r) && inP(r.date, P));
  const pdc = breeding.filter(r => r.result === 'Pregnant' && inP(r.pdDate, P));
  const calv = breeding.filter(r => r.outcome === 'Live calf' && inP(r.calvingDate, P));
  if (breeding.length) { a.served = svc.length; a.pregnancies = pdc.length; a.calvings = calv.length; }
  // health
  if (health.length || db.health.length) {
    a.treated = sum(health.filter(r => r.kind === 'Treatment'), r => has(r.head) ? r.head : 1);
    a.vaccinated = sum(health.filter(r => r.kind === 'Vaccination' || r.kind === 'Deworming'), r => has(r.head) ? r.head : 1);
  }
  // feed
  if (feed.length) {
    a.feedConsumed = sum(feed, r => r.issued);
    a.feedCost = sum(feed, r => num(r.received) * num(r.unitCost));
    a.forage = sum(feed.filter(r => r.kind === 'Forage'), r => r.received);
  }
  // customers
  const cust = new Set();
  milk.filter(r => num(r.sold) > 0 && r.buyer && r.buyer.trim()).forEach(r => cust.add(r.buyer.trim().toLowerCase()));
  sales.filter(r => r.customer && r.customer.trim()).forEach(r => cust.add(r.customer.trim().toLowerCase()));
  if (cust.size) a.customers = cust.size;
  // finance
  const healthCost = sum(health, r => r.cost);
  const hasCost = feed.length || health.length;
  const other = P.otherExpenses || 0;
  if (hasCost || other) a.opex = (a.feedCost || 0) + healthCost + other;
  const nonMilk = sales.filter(r => !/milk/i.test(r.product || ''));
  const nmRev = sum(nonMilk, r => num(r.qty) * num(r.price));
  if (a.milkRevenue !== undefined || nmRev) {
    const rev = (a.milkRevenue || 0) + nmRev;
    if (a.opex !== undefined) a.surplus = rev - a.opex;
  }
  return a;
}

function sumManual(db, months, key, field) {
  let total = null;
  for (const m of months) {
    const rep = db.reports[monthKey(m)];
    if (!rep) continue;
    let v;
    if (field === 'other') v = rep.other; else v = rep.overrides && rep.overrides[key];
    if (has(v)) total = (total || 0) + parseFloat(v);
  }
  return total;
}

function reportData(db, period, settings, today) {
  today = today || todayISO();
  const P = resolvePeriod(period, settings);
  const rep = db.reports[P.key] || {};
  // other expenses (manual): month -> own input, quarter/year -> sum of months
  P.otherExpenses = period.type === 'month' ? num(rep.other) : (sumManual(db, P.months, null, 'other') || 0);
  const auto = computeAuto(db, P, settings, today);
  const rows = INDICATORS.map(ind => {
    const k = ind.k;
    let autoVal = auto[k];
    if (ind.manual && period.type !== 'month') { const s = sumManual(db, P.months, k); autoVal = s === null ? undefined : s; }
    const ov = rep.overrides ? rep.overrides[k] : undefined;
    const hasOv = has(ov);
    const actual = hasOv ? parseFloat(ov) : (autoVal !== undefined && isFinite(autoVal) ? autoVal : null);
    // target
    let target = null, targetDerived = false;
    const own = rep.targets ? rep.targets[k] : undefined;
    if (has(own)) target = parseFloat(own);
    else if (period.type !== 'month') {
      const vals = [];
      for (const m of P.months) { const mr = db.reports[monthKey(m)]; const t = mr && mr.targets ? mr.targets[k] : undefined; if (has(t)) vals.push(parseFloat(t)); }
      if (vals.length) {
        targetDerived = true;
        target = ind.agg === 'sum' ? vals.reduce((x, y) => x + y, 0) : ind.agg === 'last' ? vals[vals.length - 1] : vals.reduce((x, y) => x + y, 0) / vals.length;
      }
    }
    const variance = (actual !== null && target !== null) ? actual - target : null;
    const ach = (actual !== null && target !== null && target !== 0) ? 100 * actual / target : null;
    return Object.assign({}, ind, { auto: autoVal !== undefined ? autoVal : null, override: hasOv ? parseFloat(ov) : null, actual, target, targetDerived, variance, ach, remarks: (rep.remarks && rep.remarks[k]) || '' });
  });
  return { P, rep, rows, period };
}

function fmtNum(v, dec) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  return Number(v).toLocaleString('en-US', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 });
}

function headerValues(period, P, settings) {
  const sm = (settings && settings.yearStart) || 1;
  if (period.type === 'month') return { month: EC_MONTHS[period.m - 1], ecYear: String(period.y), gc: P.gcLabel };
  if (period.type === 'quarter') return { quarter: 'Q' + period.q, ecYear: String(period.y), months: P.months.map(m => EC_MONTHS[m.m - 1]).join(', ') };
  return { ecYear: String(period.y), gc: P.gcLabel, period: sm === 1 ? 'Meskerem – Pagume' : 'Hamle – Sene (fiscal year)' };
}

/* ---------- Alerts for dashboard ---------- */
function alerts(db, today) {
  today = today || todayISO();
  const out = [];
  const pdDue = db.breeding.filter(r => isServed(r) && r.result === 'Pending' && daysBetween(r.date, today) >= 45);
  if (pdDue.length) out.push({ level: 'warn', text: pdDue.length + ' service' + (pdDue.length > 1 ? 's' : '') + ' awaiting pregnancy diagnosis (45+ days)', go: 'breeding' });
  const calvSoon = db.breeding.filter(r => isServed(r) && r.result === 'Pregnant' && !r.calvingDate && r.date && (() => { const d = daysBetween(today, addDays(r.date, 283)); return d >= 0 && d <= 30; })());
  if (calvSoon.length) out.push({ level: 'info', text: calvSoon.length + ' cow' + (calvSoon.length > 1 ? 's' : '') + ' expected to calve within 30 days', go: 'breeding' });
  const overdueCalv = db.breeding.filter(r => isServed(r) && r.result === 'Pregnant' && !r.calvingDate && r.date && addDays(r.date, 283) < today);
  if (overdueCalv.length) out.push({ level: 'warn', text: overdueCalv.length + ' pregnant cow' + (overdueCalv.length > 1 ? 's' : '') + ' past expected calving date', go: 'breeding' });
  const rec = db.sales.reduce((s, r) => s + Math.max(0, num(r.qty) * num(r.price) - num(r.cash)), 0);
  if (rec > 0) out.push({ level: 'warn', text: 'Outstanding receivables: ' + fmtNum(rec, 2) + ' ETB', go: 'sales' });
  const od = db.actions.filter(r => r.deadline && r.deadline < today && r.status !== 'Completed' && r.status !== 'Cancelled');
  if (od.length) out.push({ level: 'bad', text: od.length + ' overdue corrective action' + (od.length > 1 ? 's' : ''), go: 'actions' });
  const last = db.milk.length ? db.milk.map(r => r.date).sort().pop() : null;
  if (!last) out.push({ level: 'info', text: 'No milk records yet. Tap “+ Milk” to start.', go: 'milk' });
  else if (daysBetween(last, today) >= 2) out.push({ level: 'info', text: 'No milk record since ' + fmtEC(last) + ' (' + daysBetween(last, today) + ' days)', go: 'milk' });
  return out;
}

/* ---------- Validation ---------- */
function validate(key, rec) {
  const errs = [], warns = [];
  const C = COLLECTIONS[key];
  for (const f of C.fields) {
    if (f.required && (rec[f.k] === undefined || rec[f.k] === '' || rec[f.k] === null)) errs.push(f.label + ' is required');
    if (f.type === 'number' && has(rec[f.k]) && parseFloat(rec[f.k]) < 0) errs.push(f.label + ' cannot be negative');
  }
  if (key === 'milk' && !errs.length) {
    if (num(rec.sold) + num(rec.onFarm) + num(rec.rejected) > num(rec.produced) + 0.0001) warns.push('Sold + used on farm + rejected is more than the milk produced.');
    if (num(rec.sold) > 0 && !has(rec.price)) warns.push('Milk sold but no price entered, so revenue will be 0.');
  }
  if (key === 'herd') {
    if ((rec.entryType === 'Born on farm' || rec.entryType === 'Purchased') && !rec.entryDate) errs.push('Enter the date born / purchased');
    if (rec.exitType && rec.exitType !== 'No' && !rec.exitDate) errs.push('Enter the date of death / sale / cull');
  }
  if (key === 'breeding') {
    if (rec.result === 'Pregnant' && !rec.pdDate) errs.push('Enter the pregnancy diagnosis date');
    if (rec.outcome && !rec.calvingDate) errs.push('Enter the actual calving date');
  }
  if (key === 'health' && has(rec.head) && parseFloat(rec.head) < 1) errs.push('Number of animals must be at least 1');
  if (key === 'sales' && num(rec.cash) > num(rec.qty) * num(rec.price) + 0.0001) warns.push('Cash received is more than the total sales.');
  return { errs, warns };
}

/* ---------- Minimal XLSX writer (zip STORE, no dependencies) ---------- */

function periodOf(t) {
  const s = state.sel;

}
function yearChoices() {
  const cy = C.currentYearLabel(today, db.settings), set = new Set();
  for (let y = cy - 4; y <= cy + 1; y++) set.add(y);
  ['milk', 'sales', 'feed', 'health', 'breeding', 'actions'].forEach(k => db[k].forEach(r => { if (r.date) set.add(C.isoToEC(r.date).y); }));
  Object.keys(db.reports).forEach(k => set.add(parseInt(k.split(':')[1], 10)));

}

}

let FORM = null, sheetOpen = false;
function openSheet(html) {
  const el = $('#sheet'); el.innerHTML = '<div class="sheet">' + html + '</div>'; el.hidden = false;
  if (!sheetOpen) { sheetOpen = true; try { history.pushState({ sheet: 1 }, ''); } catch (e) { } }

function closeSheet() {
  const el = $('#sheet'); el.hidden = true; el.innerHTML = '';

function fieldHtml(f, v) {
  const val = v === undefined || v === null ? '' : v, id = 'f_' + f.k;
  let inner;
  if (f.type === 'calc') return '<label class="f"><span>' + esc(f.label) + '</span><div class="calc" data-calc="' + f.k + '">—</div>' + (f.hint ? '<em>' + esc(f.hint) + '</em>' : '') + '</label>';
  if (f.type === 'select') inner = '<select name="' + f.k + '" id="' + id + '">' + f.options.map(o => '<option value="' + esc(o) + '"' + (String(o) === String(val) ? ' selected' : '') + '>' + (o === '' ? '—' : esc(o)) + '</option>').join('') + '</select>';
  else if (f.type === 'textarea') inner = '<textarea name="' + f.k + '" id="' + id + '">' + esc(val) + '</textarea>';
  else if (f.type === 'number') inner = '<input name="' + f.k + '" id="' + id + '" type="number" inputmode="decimal" step="any" min="0" value="' + esc(val) + '">';
  else if (f.type === 'date') inner = '<input name="' + f.k + '" id="' + id + '" type="date" value="' + esc(val) + '">';
  else inner = '<input name="' + f.k + '" id="' + id + '" type="text" value="' + esc(val) + '"' + (f.list ? ' list="dl_' + f.k + '"' : '') + ' autocomplete="off">' + (f.list ? '<datalist id="dl_' + f.k + '">' + f.list.map(o => '<option value="' + esc(o) + '">').join('') + '</datalist>' : '');
  return '<label class="f"><span>' + esc(f.label) + (f.required ? ' *' : '') + '</span>' + inner + (f.type === 'date' ? '<em data-ec="' + f.k + '"></em>' : '') + (f.hint ? '<em>' + esc(f.hint) + '</em>' : '') + '</label>';
}
function openForm(cfg) {
  FORM = cfg;
  const v = cfg.values || {};
  openSheet('<h3>' + esc(cfg.title) + '</h3><div id="formmsg"></div>' + cfg.fields.map(f => fieldHtml(f, v[f.k])).join('') +
    '<div class="row"><button class="btn" data-act="saveform" id="savebtn">Save</button><button class="btn sec" data-act="closesheet">Cancel</button></div>' +
    (cfg.onDelete ? '<button class="btn del full" style="margin-top:10px" data-act="delform">Delete</button>' : ''));
  refreshForm();
}
function formValues() {
  const rec = {};
  FORM.fields.forEach(f => {
    if (f.type === 'calc') return;
    const el = $('#sheet [name="' + f.k + '"]'); if (!el) return;
    let x = el.value;
    if (f.type === 'number') { x = x === '' ? '' : parseFloat(x); if (typeof x === 'number' && !isFinite(x)) x = ''; }
    else if (typeof x === 'string') x = x.trim();
    rec[f.k] = x;
  });
  return rec;
}
function refreshForm() {
  if (!FORM) return;
  const rec = formValues();
  FORM.fields.forEach(f => {
    if (f.type === 'calc') { const el = $('#sheet [data-calc="' + f.k + '"]'); if (el) { const v = f.calc(rec); el.textContent = f.isDate ? (v ? C.fmtEC(v) + ' (' + v + ')' : '—') : fmt(v, f.dec || 0) + (f.k === 'closing' ? ' kg' : ''); } }
    if (f.type === 'date') { const em = $('#sheet [data-ec="' + f.k + '"]'); if (em) em.textContent = rec[f.k] ? C.fmtEC(rec[f.k]) : 'Gregorian date; Ethiopian date shows here'; }
  });
}
function defaults(key) {
  const rec = {};
  C.COLLECTIONS[key].fields.forEach(f => { if (f.def !== undefined) rec[f.k] = f.def; });
  if (C.COLLECTIONS[key].fields.some(f => f.k === 'date')) rec.date = today;
  if (key === 'milk' && db.milk.length) { const last = db.milk.slice().sort((a, b) => (b.created || 0) - (a.created || 0))[0]; rec.price = last.price; rec.buyer = last.buyer; rec.session = new Date().getHours() < 12 ? 'Morning' : 'Evening'; }
  if (key === 'feed' && db.feed.length) { const last = db.feed.slice().sort((a, b) => (b.created || 0) - (a.created || 0))[0]; rec.kind = last.kind; }
  return rec;
}
function openRecord(key, id, preset) {
  const C0 = C.COLLECTIONS[key], existing = id ? db[key].find(r => r.id === id) : null;
  const vals = existing ? existing : Object.assign(defaults(key), preset || {});
  openForm({
    title: (existing ? 'Edit ' : 'New ') + C0.title.toLowerCase() + ' record', fields: C0.fields, values: vals,
    validate: rec => {
      const v = C.validate(key, rec);
      if (key === 'milk' && rec.date && db.milk.some(r => r.date === rec.date && r.session === rec.session && r.id !== id)) v.warns.push('A record for this date and session already exists.');
      return v;
    },
    onSave: rec => {
      if (existing) Object.assign(existing, rec); else db[key].push(Object.assign({ id: C.uid(), created: Date.now() }, rec));
      save(); toast('Saved');
    },
    onDelete: existing ? () => { if (confirm('Delete this record?')) { db[key] = db[key].filter(r => r.id !== id); save(); toast('Deleted'); return true; } return false; } : null
  });
}

/* ---------- export ---------- */
function stamp() { const e = C.isoToEC(today); return e.y + '-' + String(e.m).padStart(2, '0') + '-' + String(e.d).padStart(2, '0') + 'EC'; }
function buildXlsxBlob() { const u8 = C.exportWorkbook(db, state.sel, db.settings, today); return new Blob([u8], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }); }
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); toast('Saved to Downloads: ' + name); }
async function shareFile(blob, name) {
  const f = new File([blob], name, { type: blob.type });
  try { if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: name }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  download(blob, name);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target === $('#sheet')) { closeSheet(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
  switch (a) {
    case 'tab': state.tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'log': state.logKey = el.dataset.key; render(); break;
    case 'go': { const g = el.dataset.go; if (g === 'actions') state.tab = 'actions'; else { state.tab = 'logs'; state.logKey = g; } render(); window.scrollTo(0, 0); break; }
    case 'actf': state.actFilter = el.dataset.f; render(); break;
    case 'more': state.limit[el.dataset.key] = (state.limit[el.dataset.key] || 60) + 100; render(); break;
    case 'add': openRecord(el.dataset.key, null, el.dataset.key === 'health' ? { kind: 'Treatment' } : null); break;
    case 'edit': openRecord(el.dataset.key, el.dataset.id); break;
    case 'closesheet': closeSheet(); break;
    case 'saveform': {
      const rec = formValues(), v = FORM.validate ? FORM.validate(rec) : { errs: [], warns: [] }, box = $('#formmsg');
      if (v.errs.length) { box.innerHTML = '<div class="err">' + v.errs.map(esc).join('<br>') + '</div>'; $('#sheet .sheet').scrollTo(0, 0); return; }
      if (v.warns.length && !FORM.warned) { FORM.warned = true; box.innerHTML = '<div class="warnbox">' + v.warns.map(esc).join('<br>') + '<br><b>Tap Save again to keep it anyway.</b></div>'; $('#sheet .sheet').scrollTo(0, 0); return; }
      FORM.onSave(rec); closeSheet(); render(); break;
    }
    case 'delform': if (FORM.onDelete && FORM.onDelete()) { closeSheet(); render(); } break;
    case 'rtype': state.rtype = el.dataset.t; render(); break;
    case 'ind': openIndicator(el.dataset.k); break;
    case 'saveind': {
      const k = el.dataset.k, rep = getRep(C.resolvePeriod(periodOf(state.rtype), db.settings).key);
      rep.targets = rep.targets || {}; rep.overrides = rep.overrides || {}; rep.remarks = rep.remarks || {};
      const tv = $('#i_t').value, ov = $('#i_o').value, rm = $('#i_r').value.trim();
      if (tv === '') delete rep.targets[k]; else rep.targets[k] = parseFloat(tv);
      if (ov === '') delete rep.overrides[k]; else rep.overrides[k] = parseFloat(ov);
      if (!rm) delete rep.remarks[k]; else rep.remarks[k] = rm;
      save(); closeSheet(); render(); toast('Saved'); break;
    }
    case 'addli': openListItem(); break;
    case 'editli': openListItem(parseInt(el.dataset.i, 10)); break;
    case 'export': { try { download(buildXlsxBlob(), 'COBFCU_Dairy_Farm_Report_' + stamp() + '.xlsx'); } catch (err) { toast('Export failed: ' + err.message); } break; }
    case 'shareX': shareFile(buildXlsxBlob(), 'COBFCU_Dairy_Farm_Report_' + stamp() + '.xlsx'); break;
    case 'backup': download(new Blob([JSON.stringify(db)], { type: 'application/json' }), 'COBFCU_Dairy_backup_' + stamp() + '.json'); break;
    case 'demo': { const D = C.demoData(today); Object.keys(D).forEach(k => db[k] = db[k].concat(D[k])); save(); render(); toast('Demo data loaded'); break; }
    case 'rmdemo': ['milk', 'herd', 'breeding', 'health', 'feed', 'sales', 'actions'].forEach(k => db[k] = db[k].filter(r => !r.demo)); save(); render(); toast('Demo data removed'); break;
    case 'clear': if (confirm('Delete ALL records, reports and settings from this phone' + (cloudCfg() ? ' AND from the cloud (every synced phone)' : '') + '? Save a backup first if unsure.') && confirm('This cannot be undone. Delete everything?')) { db = C.emptyDB(); save(); initSel(); render(); toast('All data deleted'); } break;
    case 'cloudconnect': {
      const p = parseCloudInput(($('#cl_cfg').value || '').trim()), fin = ($('#cl_farm').value || '').trim();
      if (!p) { toast('Could not read that. Paste the firebaseConfig from the Firebase console.'); break; }
      const farm = fin || p.farm || genFarm();
      if (!/^[A-Za-z0-9_-]{8,64}$/.test(farm)) { toast('Farm code: 8 to 64 letters, numbers, - or _'); break; }
      try { localStorage.setItem(CFG_KEY, JSON.stringify({ firebase: p.firebase, farm })); location.reload(); } catch (err) { toast('Could not save the connection on this phone'); }
      break;
    }
    case 'cloudshare': {
      const c = cloudCfg(); if (!c) break;
      const code = 'COBFCU1:' + btoa(JSON.stringify(c));
      (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => toast('Setup code copied. Paste it on the other phone.')).catch(() => prompt('Copy this setup code:', code));
      break;
    }
    case 'cloudsignin': cloudGoogle(); break;
    case 'cloudsignout': (async () => { try { await cloud.mods.auth.signOut(cloud.auth); } catch (err) { } location.reload(); })(); break;
    case 'cloudsync': if (cloud.on) { cloudFlush(); toast('Sync requested'); } else { cloud.started = false; cloudStart(); toast('Reconnecting…'); } break;
    case 'clouddisc': if (confirm('Disconnect this phone from the cloud? Data on this phone and in the cloud is kept.')) { try { localStorage.removeItem(CFG_KEY); } catch (err) { } location.reload(); } break;
    case 'install': if (installEvt) { installEvt.prompt(); installEvt = null; render(); } break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'filter') { state.filter[el.dataset.key] = el.value; render(); }
  else if (el.dataset.act === 'rsel') {
    const t = state.rtype, w = el.dataset.w, v = parseInt(el.value, 10), s = state.sel;
    if (t === 'month') s.month[w] = v; else if (t === 'quarter') s.quarter[w] = v; else s.year.y = v;
    render();
  } else if (el.dataset.act === 'restore') {
    const f = el.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const d = C.normalizeDB(JSON.parse(rd.result)); if (!Array.isArray(d.milk)) throw new Error('not a backup'); if (confirm('Replace everything on this phone with the backup?')) { db = d; save(); initSel(); render(); toast('Backup restored'); } } catch (err) { toast('That file is not a valid backup'); } };
    rd.readAsText(f);
  } else if (el.dataset.set) {
    db.settings[el.dataset.set] = el.dataset.num ? parseInt(el.value, 10) : el.value; save();
    if (el.dataset.set === 'yearStart') { initSel(); }
  } else if (el.dataset.rep) {
    const [kind, idx] = el.dataset.rep.split(':'), key = C.resolvePeriod(periodOf(state.rtype), db.settings).key, rep = getRep(key);
    if (kind === 'header') { rep.header = rep.header || {}; rep.header[idx] = el.value; }
    else if (kind === 'narr') { rep.narrative = rep.narrative || {}; rep.narrative[parseInt(idx, 10)] = el.value; }
    else if (kind === 'other') { if (el.value === '') delete rep.other; else rep.other = parseFloat(el.value); }
    save(); if (el.dataset.rerender) render();
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.act === 'search') { state.q = e.target.value; const pos = e.target.selectionStart; render(); const n = $('[data-act="search"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } return; }
  if (FORM && e.target.closest('#sheet')) refreshForm();
});
document.addEventListener('change', e => { if (FORM && e.target.closest('#sheet')) refreshForm(); });
window.addEventListener('popstate', () => { if (sheetOpen) { sheetOpen = false; $('#sheet').hidden = true; $('#sheet').innerHTML = ''; FORM = null; } });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (state.tab === 'more') render(); });
window.addEventListener('focus', () => { if (C.todayISO() !== today) render(); });

load(); initSel(); render();
window.addEventListener('online', () => { if (cloudCfg() && !cloud.on) cloudStart(); else { setCloud(cloud.status, cloud.msg); cloudFlush(); } });
window.addEventListener('offline', () => setCloud(cloud.status, cloud.msg));
cloudStart();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
window.__app = { get db() { return db; }, state, render };
})();
</script>
</body>
